<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agent · BLACKCAT</title>
<meta name="description" content="Chat with an AI agent built on BLACKCAT.">
<meta name="theme-color" content="#0b0710">
<meta property="og:type" content="website">
<meta property="og:title" content="Chat with an agent built on BLACKCAT">
<meta property="og:description" content="An AI agent made with BLACKCAT, the AI agent framework in your browser.">
<meta property="og:image" content="https://www.tryblackcat.xyz/og.png?v=4">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@tryblackcat">
<meta name="twitter:image" content="https://www.tryblackcat.xyz/og.png?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0710;--fg:#f7efe6;--dim:rgba(247,239,230,.66);--mute:rgba(247,239,230,.45);--line:rgba(247,239,230,.09);--kira:#b388ff;
  --grad:linear-gradient(140deg,rgba(179,136,255,.55),rgba(247,239,230,.07) 38%,rgba(247,239,230,.04) 62%,rgba(179,136,255,.28));--card:rgba(17,11,25,.82)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(60% 45% at 50% -5%,rgba(179,136,255,.18),transparent 70%),var(--bg);color:var(--fg);font:16px/1.55 Manrope,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center}
a{color:inherit}
header{width:min(760px,100%);display:flex;align-items:center;justify-content:space-between;padding:18px 18px 6px}
.wm{display:inline-flex;align-items:center;gap:.4em;text-decoration:none;font:800 18px/1 Syne,sans-serif}
.wm img{height:26px;width:26px;border-radius:50%;object-fit:cover;border:1px solid rgba(179,136,255,.45)}
.make{padding:9px 16px;border-radius:999px;background:var(--fg);color:#0b0710;font-weight:700;font-size:13.5px;text-decoration:none}
main{width:min(760px,100%);flex:1;display:flex;flex-direction:column;padding:10px 14px 14px;min-height:0}
.card{border-radius:28px;border:1px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,var(--grad) border-box;box-shadow:0 40px 120px rgba(110,60,210,.22);display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.who{display:flex;gap:14px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.who img{width:56px;height:56px;border-radius:16px;object-fit:cover;background:#000;border:1px solid rgba(179,136,255,.3);flex:none}
.who h1{font:700 22px/1.1 Syne,sans-serif;letter-spacing:-.02em}
.who p{color:var(--mute);font-size:13.5px;margin-top:3px}
.on{display:inline-flex;align-items:center;gap:6px;color:#5dffa8;font-size:12.5px;font-weight:700}
.on::before{content:"";width:7px;height:7px;border-radius:50%;background:#5dffa8;box-shadow:0 0 10px #5dffa8}
.log{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;min-height:240px}
.m{max-width:85%;padding:11px 15px;border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.a{align-self:flex-start;background:rgba(247,239,230,.06);border:1px solid var(--line);border-bottom-left-radius:6px}
.m.u{align-self:flex-end;background:linear-gradient(180deg,#c4a2ff,#a171ff);color:#0b0710;font-weight:500;border-bottom-right-radius:6px}
.m.t{color:var(--mute)}
.bio{color:var(--dim);font-size:14.5px}
form{display:flex;gap:8px;margin:12px;padding:6px;border-radius:999px;border:1px solid var(--line);background:rgba(11,7,16,.6)}
form:focus-within{border-color:rgba(179,136,255,.6);box-shadow:0 0 0 4px rgba(179,136,255,.12)}
input{flex:1;min-width:0;border:0;background:none;color:inherit;font:inherit;padding:10px 14px;outline:0}
button{border:0;border-radius:999px;padding:0 20px;background:linear-gradient(180deg,#c4a2ff,#a171ff);color:#0b0710;font:700 15px Manrope,sans-serif;cursor:pointer}
button:disabled{opacity:.5}
footer{padding:10px 0 18px;color:var(--mute);font-size:12.5px;text-align:center}
.err{padding:40px 24px;text-align:center}
.err h1{font:700 26px Syne,sans-serif;margin-bottom:10px}
</style>
</head>
<body>
<header><a class="wm" href="/">BLACKCAT</a><a class="make" href="/studio">Make your own</a></header>
<main id="main"><div class="card"><div class="log"><div class="m a t">Loading the agent…</div></div></div></main>
<footer>Built with BLACKCAT · AI answers can be wrong. Nothing here is financial advice.</footer>
<script>
(() => {
  const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const id = (location.pathname.match(/\/a\/([A-Za-z0-9]{6,16})/) || [])[1] || new URLSearchParams(location.search).get('id') || '';
  const fail = (t, d) => { $('#main').innerHTML = `<div class="card err"><h1>${esc(t)}</h1><p class="bio">${esc(d)}</p><p style="margin-top:20px"><a class="make" href="/studio">Make your own agent</a></p></div>`; };
  if (!id) return fail('No agent here', 'This link is missing its agent id.');
  let hist = [], busy = false;
  fetch('/api/share?id=' + encodeURIComponent(id)).then(r => r.json().then(j => ({ ok: r.ok, j }))).then(({ ok, j }) => {
    if (!ok) return fail('Agent not found', j.reply || 'This agent link does not exist or was removed.');
    document.title = j.name + ' · BLACKCAT';
    const av = j.avatar || '/apple-touch-icon.png';
    $('#main').innerHTML = `<div class="card">
      <div class="who"><img src="${esc(av)}" alt=""><div><h1>${esc(j.name)}</h1><p>${esc(j.role || 'AI agent')} · <span class="on">online</span></p></div></div>
      <div class="log" id="log" aria-live="polite"><div class="m a">Hi, I'm ${esc(j.name)}. ${esc(j.bio || 'Ask me anything.')}</div></div>
      <form id="f"><input id="q" placeholder="Message ${esc(j.name)}…" autocomplete="off" maxlength="800" aria-label="Message"><button id="b">Send</button></form></div>`;
    const log = $('#log'), add = (cls, t) => { const d = document.createElement('div'); d.className = 'm ' + cls; d.textContent = t; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; };
    $('#f').addEventListener('submit', async e => {
      e.preventDefault(); const q = $('#q').value.trim(); if (!q || busy) return;
      busy = true; $('#b').disabled = true; $('#q').value = '';
      add('u', q); hist.push({ role: 'user', content: q }); const w = add('a t', '…');
      try {
        const r = await fetch('/api/agent-chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id, messages: hist.slice(-12) }) });
        const j2 = await r.json().catch(() => ({}));
        const t = j2.reply || 'Something went wrong. Please try again.';
        w.className = 'm a'; w.textContent = t; if (r.ok) hist.push({ role: 'assistant', content: t }); else hist.pop();
      } catch { w.className = 'm a'; w.textContent = 'Could not reach the agent. Check your connection and try again.'; hist.pop(); }
      busy = false; $('#b').disabled = false; $('#q').focus(); log.scrollTop = log.scrollHeight;
    });
  }).catch(() => fail('Could not load the agent', 'Check your connection and try again.'));
})();
</script>
</body>
</html>
