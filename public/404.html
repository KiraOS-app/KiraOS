<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — BLACKCAT</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<meta name="theme-color" content="#0b0710">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0710;--fg:#f7efe6;--dim:rgba(247,239,230,.66);--accent:#b388ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,sans-serif;display:grid;place-items:center;padding:24px;text-align:center}
img{width:120px;height:120px;object-fit:cover;border:2px solid var(--fg);box-shadow:6px 6px 0 var(--accent);margin-bottom:28px}
.code{font:600 12px "JetBrains Mono",monospace;letter-spacing:.18em;color:#0b0710;background:var(--accent);display:inline-block;padding:6px 10px 5px;margin-bottom:18px}
h1{font:400 clamp(32px,7vw,56px)/1.05 "Archivo Black",sans-serif;letter-spacing:-.02em;margin-bottom:12px}
p{color:var(--dim);max-width:420px;margin:0 auto 30px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a{display:inline-block;padding:14px 22px;font:600 13px "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.08em;text-decoration:none;border:2px solid var(--fg);color:var(--fg)}
a.main{background:var(--accent);border-color:var(--accent);color:#0b0710}
a:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--fg)}
</style>
</head>
<body>
<main>
  <img src="/cat.jpg" alt="BCAT, the BLACKCAT cat">
  <div class="code">404</div>
  <h1>Lost in the dark</h1>
  <p>This page doesn't exist, or it moved. The cat checked twice.</p>
  <div class="btns"><a class="main" href="/">Home</a><a href="/studio">Open Studio</a></div>
</main>
</body>
</html>
